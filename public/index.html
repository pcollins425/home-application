<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home — Transactions</title>
  <script>
    window.__BASE = location.pathname.startsWith("/plaid") ? "/plaid" : "";
    document.write('<link rel="stylesheet" href="' + window.__BASE + '/styles.css?v=11" />');
  </script>
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <div>
        <p class="eyebrow">Plaid accounts</p>
        <h1>Transactions</h1>
        <p class="sub" id="statusLine">Starting…</p>
      </div>
      <div class="actions">
        <button type="button" id="linkBtn" class="btn primary">Log in to bank</button>
        <button type="button" id="syncBtn" class="btn">Sync now</button>
        <a id="logoutLink" class="btn" href="#">Sign out</a>
      </div>
    </header>

    <section id="app">
      <div class="meta" id="meta"></div>
      <div class="layout">
        <aside class="nav card" id="nav">
          <p class="nav-label">Accounts</p>
          <button type="button" class="nav-all" id="navAll">All transactions</button>
          <div id="tree"></div>
        </aside>
        <div class="main-pane">
          <div class="toolbar">
            <p class="scope" id="scopeLabel">All</p>
            <div class="range">
              <label>
                From
                <input type="month" id="rangeFrom" />
              </label>
              <label>
                To
                <input type="month" id="rangeTo" />
              </label>
              <button type="button" class="btn" id="rangeApply">Apply range</button>
              <button type="button" class="btn" id="rangeClear" hidden>Clear range</button>
            </div>
            <label class="search">
              <span class="sr-only">Search</span>
              <input
                type="search"
                id="searchInput"
                placeholder="Search in this view…"
                autocomplete="off"
              />
            </label>
            <p class="result-meta" id="resultMeta"></p>
          </div>
          <div class="month-totals" id="monthTotals" hidden></div>
          <div class="table-wrap card">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Amount</th>
                  <th>Description</th>
                  <th>Bank</th>
                  <th>Account</th>
                  <th>Location</th>
                </tr>
              </thead>
              <tbody id="rows">
                <tr><td colspan="6" class="empty">Starting…</td></tr>
              </tbody>
            </table>
          </div>
          <div class="pager" id="pager" hidden>
            <button type="button" class="btn" id="prevBtn">Previous</button>
            <button type="button" class="btn" id="nextBtn">Next</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script>
    document.getElementById("logoutLink").href = (window.__BASE || "") + "/auth/logout";
    document.write('<script src="' + (window.__BASE || "") + '/app.js?v=11"><\/script>');
  </script>
</body>
</html>
